name: Ubuntu

on:
  push:
    branches:
      - main
      - CICD
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: GCC 16
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - name: Install CMake and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake git ca-certificates

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build and test
        run: cmake --build build --parallel 2
